name: Build and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      terraria_version:
        description: "Server version without dots (e.g. 1461). Blank = latest from terraria.org"
        required: false
  schedule:
    # Weekly rebuild picks up new Terraria releases automatically
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/terraria

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Terraria version
        id: version
        run: |
          v="${{ inputs.terraria_version }}"
          if [ -z "$v" ]; then
            v=$(curl -fsSL https://terraria.org/api/get/dedicated-servers-names \
                | grep -oE 'terraria-server-[0-9]+\.zip' | head -1 | grep -oE '[0-9]+')
          fi
          [ -n "$v" ] || { echo "Could not resolve version"; exit 1; }
          dotted=$(echo "$v" | sed 's/./&./g; s/\.$//')
          echo "raw=$v" >> "$GITHUB_OUTPUT"
          echo "dotted=$dotted" >> "$GITHUB_OUTPUT"
          echo "Terraria $dotted ($v)"

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: terraria:test
          build-args: TERRARIA_VERSION=${{ steps.version.outputs.raw }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -e WORLD_SIZE=1 -e WORLD_NAME=smoke terraria:test
          for i in $(seq 1 60); do
            if docker logs smoke 2>&1 | grep -q "Server started"; then
              echo "Server started"
              docker stop -t 60 smoke
              docker logs smoke 2>&1 | tail -20
              docker cp smoke:/data/worlds/smoke.wld /tmp/smoke.wld
              ls -la /tmp/smoke.wld
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              break
            fi
            sleep 5
          done
          echo "Server failed to start"
          docker logs smoke 2>&1 | tail -50
          exit 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: TERRARIA_VERSION=${{ steps.version.outputs.raw }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.dotted }}
          cache-from: type=gha
